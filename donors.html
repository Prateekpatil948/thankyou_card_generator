<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Donors — 1008 Parshwanath Digambar Jain Mandir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-950:#231a15;
    --stone-100:#efe8dd;
    --stone-50:#f7f3ea;
    --maroon:#5A0F16;
    --gold:#C9A227;
    --gold-light:#E9C863;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #2c211a 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, #2c211a 0%, transparent 45%),
      var(--stone-950);
    color: var(--stone-100);
    min-height:100vh;
    padding: 14px 16px 20px;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }
  .register-head{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .temple-name{
    margin:0;
    color:var(--gold-light);
    background:linear-gradient(90deg, var(--gold-light), #fff1b1, var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    font-size:24px;
    font-weight:600;
    text-align:center;
    white-space:nowrap;
  }
  .back-link{
    display:inline-flex;
    justify-self:start;
    align-items:center;
    gap:8px;
    margin:0;
    font-size:11px;
    font-weight:600;
    color:#e7dfd1;
    text-decoration:none;
    padding:6px 10px;
    border:1px solid rgba(255,255,255,0.16);
    border-radius:10px;
    background:rgba(255,255,255,0.03);
    transition:all .15s ease;
  }
  .back-link:hover{
    color:var(--gold-light);
    border-color:var(--gold);
    background:rgba(201,162,39,0.09);
  }
  .header-logo{
    justify-self:end;
    width:104px;
    height:104px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid var(--gold);
    box-shadow:0 3px 10px rgba(201,162,39,.28);
  }

  .panel{
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn-primary, .btn-secondary{
    padding:9px 13px;
    border-radius:11px;
    border:none;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    font-family:'Poppins',sans-serif;
  }
  .btn-primary{
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color:#2b2007;
    font-weight:700;
  }
  .btn-secondary{
    border:1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.03);
    color:#e7dfd1;
  }
  .btn-primary:disabled, .btn-secondary:disabled{
    opacity:.45;
    cursor:not-allowed;
  }

  .top-panel{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .top-panel .summary{ justify-content:center; }
  .top-panel .toolbar{ margin-left:auto; }
  @media (max-width: 700px){
    .register-head{ grid-template-columns:1fr auto; }
    .temple-name{ grid-column:1 / -1; grid-row:2; white-space:normal; font-size:14px; }
  }

  .summary{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    font-size:13px;
    color:#c9bfae;
  }
  .summary b{ color: var(--stone-50); font-size:19px; display:block; }

  .table-wrap{
    overflow-x:auto;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  table{
    width:100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 600px;
  }
  thead th{
    text-align:left;
    background: rgba(255,255,255,0.05);
    color: var(--gold-light);
    font-weight:600;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding: 10px 12px;
    white-space:nowrap;
    position: sticky;
    top:0;
  }
  tbody td{
    padding: 9px 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
    color: var(--stone-100);
    vertical-align: middle;
  }
  tbody tr:hover{ background: rgba(255,255,255,0.03); }
  .row-download{
    padding:8px 11px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.03);
    color:var(--stone-50);
    font:600 12px 'Poppins',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .row-download:hover{ border-color:var(--gold); color:var(--gold-light); }
  .empty-state{
    padding: 34px 18px;
    text-align:center;
    color:#a89c86;
    font-size:13.5px;
  }
  .pagination{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-top:12px;
    font-size:12px;
    color:#c9bfae;
  }
  .pagination button{
    padding:7px 11px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.03);
    color:#e7dfd1;
    font:600 12px 'Poppins',sans-serif;
    cursor:pointer;
  }
  .pagination button:disabled{ opacity:.4; cursor:not-allowed; }

  @media (max-width: 700px){
    body{ padding:14px 12px 18px; }
    .register-head{ margin-bottom:12px; }
    .header-logo{ width:82px; height:82px; }
    .back-link{ font-size:12px; padding:8px 12px; }
    .panel{ padding:12px; border-radius:15px; margin-bottom:12px; }
    .top-panel{ display:block; }
    .top-panel .summary{
      display:grid !important;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:16px 10px;
      text-align:center;
    }
    .summary b{ font-size:18px; }
    .top-panel .toolbar{ margin:18px 0 0; }
    .top-panel .toolbar .btn-primary{ width:100%; padding:12px; font-size:13px; }

    /* Present each donor as a readable card instead of a wide, clipped table. */
    .table-wrap{ overflow:visible; border:0; border-radius:0; }
    table, tbody, tr, td{ display:block; width:100%; }
    table{ min-width:0; }
    thead{ display:none; }
    tbody{ display:grid; gap:10px; }
    tbody tr{
      padding:5px 12px;
      border:1px solid rgba(255,255,255,0.09);
      border-radius:12px;
      background:rgba(255,255,255,0.025);
    }
    tbody td{
      display:grid;
      grid-template-columns:minmax(105px, 40%) 1fr;
      gap:10px;
      padding:8px 0;
      border-top:1px solid rgba(255,255,255,0.06);
      overflow-wrap:anywhere;
    }
    tbody td:first-child{ border-top:0; }
    tbody td::before{
      content:attr(data-label);
      color:var(--gold-light);
      font-size:10px;
      font-weight:600;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    tbody td:last-child{ display:block; padding-top:11px; }
    tbody td:last-child::before{ display:none; }
    .row-download{ width:100%; padding:10px; }
    .pagination{ justify-content:center; gap:7px; flex-wrap:wrap; text-align:center; }
    .pagination button{ padding:8px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="register-head">
    <a class="back-link" href="index.html" aria-label="Back to card generator">← <span>Back</span></a>
    <h1 class="temple-name">1008 Parshwanath Digambar Jain Puratan Basadi · Vaddebail</h1>
    <img class="header-logo" src="logo.jpg" alt="Temple logo">
  </header>

  <div class="panel top-panel">
    <div class="summary" id="summary" style="display:none;"></div>
    <div class="toolbar">
      <button class="btn-primary" id="downloadAllBtn" type="button" disabled>⬇ Download All (CSV)</button>
    </div>
  </div>

  <div class="panel" id="tablePanel" style="display:none;">
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination" aria-label="Donor list pagination"></div>
  </div>

  <div class="panel" id="emptyPanel">
    <div class="empty-state">No donor data loaded yet.</div>
  </div>

</div>

<script>
let headers = [];
let rows = [];
let currentPage = 1;
const ROWS_PER_PAGE = 10;

function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function parseCSVLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return { headers: [], rows: [] };
  const hdrs = parseCSVLine(lines[0]).map(h => h.trim());
  const data = lines.slice(1).map(line => parseCSVLine(line));
  return { headers: hdrs, rows: data };
}

function buildCSV(hdrs, dataRows) {
  return [hdrs, ...dataRows].map(row => row.map(csvEscape).join(',')).join('\r\n');
}

function triggerDownload(filename, csvText) {
  const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function findColumnIndex(namesToTry) {
  for (const name of namesToTry) {
    const idx = headers.findIndex(h => h.toLowerCase() === name.toLowerCase());
    if (idx !== -1) return idx;
  }
  return -1;
}

function dateToInputValue(dateValue) {
  if (!dateValue) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) return dateValue;
  const date = new Date(dateValue);
  if (Number.isNaN(date.getTime())) return '';
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
}

function renderTable() {
  const tableHead = document.getElementById('tableHead');
  const tableBody = document.getElementById('tableBody');
  const tablePanel = document.getElementById('tablePanel');
  const emptyPanel = document.getElementById('emptyPanel');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const summary = document.getElementById('summary');

  if (!rows.length) {
    tablePanel.style.display = 'none';
    emptyPanel.style.display = 'block';
    downloadAllBtn.disabled = true;
    summary.style.display = 'none';
    return;
  }

  tablePanel.style.display = 'block';
  emptyPanel.style.display = 'none';
  downloadAllBtn.disabled = false;

  tableHead.innerHTML = headers.map(h => `<th>${h}</th>`).join('') + '<th>Action</th>';

  const reversedRows = rows.slice().reverse();
  const totalPages = Math.max(1, Math.ceil(reversedRows.length / ROWS_PER_PAGE));
  currentPage = Math.min(currentPage, totalPages);
  const pageRows = reversedRows.slice((currentPage - 1) * ROWS_PER_PAGE, currentPage * ROWS_PER_PAGE);

  tableBody.innerHTML = '';
  pageRows.forEach((row) => {
    const tr = document.createElement('tr');
    headers.forEach((header, i) => {
      const td = document.createElement('td');
      td.dataset.label = header;
      td.textContent = row[i] ?? '';
      tr.appendChild(td);
    });

    const actionCell = document.createElement('td');
    actionCell.dataset.label = 'Action';
    const downloadBtn = document.createElement('button');
    downloadBtn.type = 'button';
    downloadBtn.className = 'row-download';
    downloadBtn.textContent = '⬇ Download';
    downloadBtn.title = 'Regenerate this thank-you card without adding another donor record';
    downloadBtn.addEventListener('click', () => {
      const nameIdx = findColumnIndex(['Donor Name', 'Name']);
      const amountIdx = findColumnIndex(['Amount (Rs)', 'Amount', 'Donation Amount']);
      const purposeIdx = findColumnIndex(['Purpose', 'Contribution towards']);
      const paymentMethodIdx = findColumnIndex(['Payment Method', 'Payment Mode', 'Donation Method']);
      const villageIdx = findColumnIndex(['Village']);
      const dateIdx = findColumnIndex(['Date of Donation', 'Date']);
      const params = new URLSearchParams({
        name: nameIdx === -1 ? '' : (row[nameIdx] || ''),
        village: villageIdx === -1 ? '' : (row[villageIdx] || ''),
        amount: amountIdx === -1 ? '' : (row[amountIdx] || ''),
        paymentMethod: paymentMethodIdx === -1 ? '' : (row[paymentMethodIdx] || ''),
        purpose: purposeIdx === -1 ? '' : (row[purposeIdx] || ''),
        date: dateIdx === -1 ? '' : dateToInputValue(row[dateIdx] || ''),
        download: '1'
      });
      window.location.href = `index.html?${params.toString()}`;
    });
    actionCell.appendChild(downloadBtn);
    tr.appendChild(actionCell);
    tableBody.appendChild(tr);
  });

  // Summary line
  const amountIdx = findColumnIndex(['Amount (Rs)', 'Amount', 'Donation Amount']);
  const paymentMethodIdx = findColumnIndex(['Payment Method', 'Payment Mode', 'Donation Method']);
  let summaryHTML = `<div><b>${rows.length}</b>Total donors</div>`;
  if (amountIdx !== -1) {
    const amountFor = (row) => {
      const n = Number(String(row[amountIdx] || '').replace(/[^0-9.\-]/g, ''));
      return isFinite(n) ? n : 0;
    };
    const total = rows.reduce((sum, r) => sum + amountFor(r), 0);
    const cashTotal = paymentMethodIdx === -1 ? 0 : rows.reduce((sum, r) =>
      sum + (/^cash$/i.test((r[paymentMethodIdx] || '').trim()) ? amountFor(r) : 0), 0);
    const upiTotal = paymentMethodIdx === -1 ? 0 : rows.reduce((sum, r) =>
      sum + (/^upi$/i.test((r[paymentMethodIdx] || '').trim()) ? amountFor(r) : 0), 0);
    summaryHTML += `<div><b>₹${total.toLocaleString('en-IN')}</b>Total contributions</div>`;
    summaryHTML += `<div><b>₹${cashTotal.toLocaleString('en-IN')}</b>Via cash</div>`;
    summaryHTML += `<div><b>₹${upiTotal.toLocaleString('en-IN')}</b>Via UPI</div>`;
  }
  summary.innerHTML = summaryHTML;
  summary.style.display = 'flex';

  const pagination = document.getElementById('pagination');
  pagination.innerHTML = `
    <button type="button" id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>← Previous</button>
    <span>Page ${currentPage} of ${totalPages}</span>
    <button type="button" id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
  document.getElementById('prevPageBtn').addEventListener('click', () => {
    currentPage--;
    renderTable();
  });
  document.getElementById('nextPageBtn').addEventListener('click', () => {
    currentPage++;
    renderTable();
  });
}

function loadFromText(text) {
  const parsed = parseCSV(text);
  headers = parsed.headers;
  rows = parsed.rows;
  currentPage = 1;
  renderTable();
}

async function tryAutoLoad() {
  try {
    const res = await fetch('donors.csv', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    const text = await res.text();
    loadFromText(text);
  } catch (e) {
    // no donors.csv alongside this page — leave the empty state showing
  }
}

document.getElementById('downloadAllBtn').addEventListener('click', () => {
  triggerDownload('donors.csv', buildCSV(headers, rows));
});

tryAutoLoad();
</script>
</body>
</html>
