const FONT_HEAD = { en: "Cinzel", kn: "Baloo Tamma 2", mr: "Baloo 2" };
const FONT_BODY = { en: "Poppins", kn: "Noto Sans Kannada", mr: "Noto Sans Devanagari" };

// ---- Auto script conversion (best-effort phonetic transliteration) ----
function detectScript(str) {
  if (/[\u0900-\u097F]/.test(str)) return 'devanagari';
  if (/[\u0C80-\u0CFF]/.test(str)) return 'kannada';
  return 'latin';
}

const TRANSLIT_TOKENS = [
  { p:'ksh', c:true, dev:'क्ष', kan:'ಕ್ಷ' },
  { p:'chh', c:true, dev:'छ', kan:'ಛ' },
  { p:'shh', c:true, dev:'ष', kan:'ಷ' },
  { p:'sh',  c:true, dev:'श', kan:'ಶ' },
  { p:'ch',  c:true, dev:'च', kan:'ಚ' },
  { p:'th',  c:true, dev:'थ', kan:'ಥ' },
  { p:'dh',  c:true, dev:'ध', kan:'ಧ' },
  { p:'bh',  c:true, dev:'भ', kan:'ಭ' },
  { p:'ph',  c:true, dev:'फ', kan:'ಫ' },
  { p:'kh',  c:true, dev:'ख', kan:'ಖ' },
  { p:'gh',  c:true, dev:'घ', kan:'ಘ' },
  { p:'ny',  c:true, dev:'ञ', kan:'ಞ' },
  { p:'k', c:true, dev:'क', kan:'ಕ' },
  { p:'g', c:true, dev:'ग', kan:'ಗ' },
  { p:'j', c:true, dev:'ज', kan:'ಜ' },
  { p:'t', c:true, dev:'त', kan:'ತ' },
  { p:'d', c:true, dev:'द', kan:'ದ' },
  { p:'n', c:true, dev:'न', kan:'ನ' },
  { p:'p', c:true, dev:'प', kan:'ಪ' },
  { p:'b', c:true, dev:'ब', kan:'ಬ' },
  { p:'m', c:true, dev:'म', kan:'ಮ' },
  { p:'y', c:true, dev:'य', kan:'ಯ' },
  { p:'r', c:true, dev:'र', kan:'ರ' },
  { p:'l', c:true, dev:'ल', kan:'ಲ' },
  { p:'v', c:true, dev:'व', kan:'ವ' },
  { p:'w', c:true, dev:'व', kan:'ವ' },
  { p:'s', c:true, dev:'स', kan:'ಸ' },
  { p:'h', c:true, dev:'ह', kan:'ಹ' },
  { p:'f', c:true, dev:'फ', kan:'ಫ' },
  { p:'z', c:true, dev:'ज', kan:'ಜ' },
  { p:'au', v:true, dev:'औ', devM:'ौ', kan:'ಔ', kanM:'ೌ' },
  { p:'ai', v:true, dev:'ऐ', devM:'ै', kan:'ಐ', kanM:'ೈ' },
  { p:'aa', v:true, dev:'आ', devM:'ा', kan:'ಆ', kanM:'ಾ' },
  { p:'ee', v:true, dev:'ई', devM:'ी', kan:'ಈ', kanM:'ೀ' },
  { p:'oo', v:true, dev:'ऊ', devM:'ू', kan:'ಊ', kanM:'ೂ' },
  { p:'ii', v:true, dev:'ई', devM:'ी', kan:'ಈ', kanM:'ೀ' },
  { p:'uu', v:true, dev:'ऊ', devM:'ू', kan:'ಊ', kanM:'ೂ' },
  { p:'a', v:true, dev:'अ', devM:'', kan:'ಅ', kanM:'' },
  { p:'i', v:true, dev:'इ', devM:'ि', kan:'ಇ', kanM:'ಿ' },
  { p:'u', v:true, dev:'उ', devM:'ु', kan:'ಉ', kanM:'ು' },
  { p:'e', v:true, dev:'ए', devM:'े', kan:'ಏ', kanM:'ೇ' },
  { p:'o', v:true, dev:'ओ', devM:'ो', kan:'ಓ', kanM:'ೋ' },
].sort((a, b) => b.p.length - a.p.length);

const VIRAMA = { devanagari: '्', kannada: '್' };

function transliterateWord(word, script) {
  let out = '';
  let i = 0;
  let pending = null;
  const lower = word.toLowerCase();
  while (i < lower.length) {
    let matched = null;
    for (const tok of TRANSLIT_TOKENS) {
      if (lower.startsWith(tok.p, i)) { matched = tok; break; }
    }
    if (!matched) {
      if (pending) { out += (script === 'devanagari' ? pending.dev : pending.kan); pending = null; }
      out += word[i];
      i += 1;
      continue;
    }
    if (matched.c) {
      if (pending) out += (script === 'devanagari' ? pending.dev : pending.kan) + VIRAMA[script];
      pending = matched;
    } else if (matched.v) {
      if (pending) {
        const matra = script === 'devanagari' ? matched.devM : matched.kanM;
        out += (script === 'devanagari' ? pending.dev : pending.kan) + matra;
        pending = null;
      } else {
        out += script === 'devanagari' ? matched.dev : matched.kan;
      }
    }
    i += matched.p.length;
  }
  if (pending) out += (script === 'devanagari' ? pending.dev : pending.kan);
  return out;
}

// Converts a raw typed name into the script matching the selected card
// language. Best-effort phonetic conversion — stays editable so the
// committee can fine-tune spelling if needed.
function transliterateForLang(raw, lang) {
  if (!raw) return raw;
  if (lang === 'en') return raw;
  if (detectScript(raw) !== 'latin') return raw; // already in an Indic script
  const targetScript = lang === 'kn' ? 'kannada' : 'devanagari';
  return raw.split(' ').map(w => w ? transliterateWord(w, targetScript) : w).join(' ');
}

function localTodayISO() {
  const now = new Date();
  const offset = now.getTimezoneOffset() * 60000;
  return new Date(now.getTime() - offset).toISOString().slice(0, 10);
}

function formatDate(dateValue, locale, options) {
  if (!dateValue) return '';
  // Add a local midday time to an input value so it never shifts by timezone.
  const date = /^\d{4}-\d{2}-\d{2}$/.test(dateValue)
    ? new Date(`${dateValue}T12:00:00`)
    : new Date(dateValue);
  return Number.isNaN(date.getTime()) ? dateValue : date.toLocaleDateString(locale, options);
}

function dateToInputValue(dateValue) {
  if (!dateValue) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) return dateValue;
  const parsed = new Date(dateValue);
  if (Number.isNaN(parsed.getTime())) return '';
  return [parsed.getFullYear(), String(parsed.getMonth() + 1).padStart(2, '0'), String(parsed.getDate()).padStart(2, '0')].join('-');
}

function formatINR(num) {
  try {
    return new Intl.NumberFormat('en-IN').format(num);
  } catch (e) {
    return String(num);
  }

const W = 1000, H = 1380;
const RENDER_SCALE = canvas.width / W;

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (let w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapStyledText(ctx, parts, maxWidth, fontFamily, fontSize) {
  const lines = [];
  let line = [], lineWidth = 0;
  parts.forEach(({ text, bold }) => {
    text.split(/\s+/).filter(Boolean).forEach(word => {
      ctx.font = `${bold ? 700 : 400} ${fontSize}px "${fontFamily}"`;
      const prefix = line.length ? ' ' : '';
      const token = prefix + word;
      const tokenWidth = ctx.measureText(token).width;
      if (line.length && lineWidth + tokenWidth > maxWidth) {
        lines.push(line);
        line = [];
        lineWidth = 0;
      }
      const rendered = line.length ? ' ' + word : word;
      ctx.font = `${bold ? 700 : 400} ${fontSize}px "${fontFamily}"`;
      const width = ctx.measureText(rendered).width;
      line.push({ text: rendered, bold, width });
      lineWidth += width;
    });
  });
  if (line.length) lines.push(line);
  return lines;
}

function drawStyledTextLines(ctx, lines, centerX, y, lineHeight, fontFamily, fontSize) {
  ctx.save();
  ctx.textAlign = 'left';
  lines.forEach(line => {
    const lineWidth = line.reduce((sum, token) => sum + token.width, 0);
    let x = centerX - lineWidth / 2;
    line.forEach(token => {
      ctx.font = `${token.bold ? 700 : 400} ${fontSize}px "${fontFamily}"`;
      ctx.fillText(token.text, x, y);
      x += token.width;
    });
    y += lineHeight;
  });
  ctx.restore();
  return y;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let bgTempleImg = new Image();

function draw() {
  const c = COPY[state.lang];
  const headFont = FONT_HEAD[state.lang];
  const bodyFont = FONT_BODY[state.lang];

  // Reset any prior transform, clear the full (larger) physical canvas,
  // then scale up so the 1000x1180 layout below fills it crisply.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(RENDER_SCALE, RENDER_SCALE);

  // background
  ctx.fillStyle = '#FBF3E3';
  ctx.fillRect(0, 0, W, H);

  // temple photo as full-bleed background
  if (bgLoaded) {
    const iw = bgTempleImg.width, ih = bgTempleImg.height;
    const s = Math.max(W / iw, H / ih);
    const dw = iw * s, dh = ih * s;
    ctx.drawImage(bgTempleImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    // translucent ivory wash so text stays legible over the photo
    ctx.fillStyle = 'rgba(251,243,227,0.87)';
    ctx.fillRect(0, 0, W, H);
  }

  // outer gold border + maroon inset frame
  ctx.strokeStyle = '#A9791F';
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, W - 36, H - 36);
  ctx.strokeStyle = '#6E1420';
  ctx.lineWidth = 10;
  ctx.strokeRect(40, 40, W - 80, H - 80);

  // corner brackets
  ctx.strokeStyle = '#A9791F';
  ctx.lineWidth = 3;
  const cl = 46, off = 26;
  [[off,off,1,1],[W-off,off,-1,1],[off,H-off,1,-1],[W-off,H-off,-1,-1]].forEach(([x,y,dx,dy])=>{
    ctx.beginPath();
    ctx.moveTo(x, y + cl*dy);
    ctx.lineTo(x, y);
    ctx.lineTo(x + cl*dx, y);
    ctx.stroke();
  });

  let y = 108;

  // invocation
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6E1420';
  ctx.font = `600 22px "${bodyFont}"`;
  ctx.fillText('🔔  ' + c.invocation + '  🔔', W/2, y);
  y += 30;

  ctx.strokeStyle = '#A9791F';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(120, y); ctx.lineTo(W-120, y); ctx.stroke();
  y += 66;

  // trust line
  ctx.fillStyle = '#5A0F16';
  ctx.font = `700 34px "${headFont}"`;
  c.trustLine.split('\n').forEach(line => { ctx.fillText(line, W/2, y); y += 42; });
  y += 16;

  // THANK YOU title
  ctx.fillStyle = '#7A1218';
  ctx.font = `800 56px "${headFont}"`;
  ctx.fillText('🪷 ' + c.title + ' 🪷', W/2, y);
  y += 40;

  ctx.fillStyle = '#3A2A17';
  ctx.font = `500 22px "${bodyFont}"`;
  wrapText(ctx, c.subtitle, W - 240).forEach(line => { ctx.fillText(line, W/2, y); y += 28; });
  y += 20;

  // decorative emblem circle
  const rad = 92;
  const cx = W/2, cy = y + rad;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, rad, 0, Math.PI*2);
  ctx.fillStyle = '#F3D998';
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#A9791F';
  ctx.stroke();
  ctx.clip();
  ctx.font = '84px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🙏', cx, cy + 6);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  y = cy + rad + 38;

  // donor name
  const displayName = state.name.trim() || (state.lang === 'en' ? 'Donor Name' : state.lang === 'kn' ? 'ದಾನಿಗಳ ಹೆಸರು' : 'दात्याचे नाव');
  ctx.fillStyle = '#6E1420';
  ctx.font = `800 46px "${headFont}"`;
  ctx.fillText(displayName, W/2, y);

  // village, shown under the donor name when it is entered
  const displayVillage = state.village.trim() && transliterateForLang(state.village.trim(), state.lang);
  if (displayVillage) {
    y += 28;
    ctx.fillStyle = '#5A0F16';
    ctx.font = `600 20px "${bodyFont}"`;
    ctx.fillText(displayVillage, W/2, y);
    y += 22;
  } else {
    y += 20;
  }

  // gold divider under name
  ctx.strokeStyle = '#C9A227';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-70, y); ctx.lineTo(W/2+70, y); ctx.stroke();
  y += 44;

  // amount badge
  const amountNum = parseFloat(state.amount);
  if (state.amount && !isNaN(amountNum) && amountNum > 0) {
    const amountStr = `${c.amountLabel}: ₹ ${formatINR(amountNum)}`;
    ctx.font = `700 30px "${bodyFont}"`;
    const tw = ctx.measureText(amountStr).width;
    const padX = 34, badgeH = 58;
    const bw = tw + padX * 2, bx = W/2 - bw/2, by = y;
    ctx.fillStyle = '#F3D998';
    roundRect(ctx, bx, by, bw, badgeH, badgeH/2);
    ctx.fill();
    ctx.strokeStyle = '#A9791F';
    ctx.lineWidth = 2;
    roundRect(ctx, bx, by, bw, badgeH, badgeH/2);
    ctx.stroke();
    ctx.fillStyle = '#5A0F16';
    ctx.textBaseline = 'middle';
    ctx.fillText(amountStr, W/2, by + badgeH/2 + 2);
    ctx.textBaseline = 'alphabetic';
    y += badgeH + 40;
  }

  const purposeText = state.purpose.trim() || c.defaultPurpose;
  // message
  ctx.fillStyle = '#2E2116';
  const [messageStart, messageEnd] = c.messageParts(displayName);
  const msgLines = wrapStyledText(ctx, [
    { text: messageStart, bold: false },
    { text: purposeText, bold: true },
    { text: messageEnd, bold: false }
  ], W - 220, bodyFont, 25);
  y = drawStyledTextLines(ctx, msgLines, W / 2, y, 36, bodyFont, 25);

  // date
  y += 10;
  const dateStr = formatDate(state.date, state.lang === 'en' ? 'en-IN' : state.lang === 'kn' ? 'kn-IN' : 'mr-IN', { day:'numeric', month:'long', year:'numeric' });
  ctx.font = `500 19px "${bodyFont}"`;
  ctx.fillStyle = '#6E1420';
  ctx.fillText(`${c.dateLabel}: ${dateStr}`, W/2, y);

  // footer band
  const footH = 170;
  ctx.fillStyle = '#5A0F16';
  ctx.fillRect(40, H - 40 - footH, W - 80, footH);

  let fy = H - 40 - footH + 44;
  ctx.fillStyle = '#FBF3E3';
  ctx.font = `500 21px "${bodyFont}"`;
  wrapText(ctx, c.footerAddr, W - 200).forEach(line => { ctx.fillText(line, W/2, fy); fy += 28; });

  fy += 18;
  ctx.fillStyle = '#F3D998';
  ctx.font = `700 20px "${headFont}"`;
  ctx.fillText(c.dharma, W/2, fy);

  // circular logo image, top right corner (drawn last so it sits above the divider line)
  {
    const logoRad = 82;
    const logoCx = W - 40 - 26 - logoRad + 4;
    const logoCy = 40 + 26 + logoRad - 4;
    ctx.save();
    ctx.beginPath();
    ctx.arc(logoCx, logoCy, logoRad, 0, Math.PI * 2);
    ctx.fillStyle = '#F3D998';
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#A9791F';
    ctx.stroke();
    ctx.clip();
    if (logoLoaded) {
      const iw = logoImg.width, ih = logoImg.height;
      const s = Math.max((logoRad * 2) / iw, (logoRad * 2) / ih);
      const dw = iw * s, dh = ih * s;
      ctx.drawImage(logoImg, logoCx - dw / 2, logoCy - dh / 2, dw, dh);
    }
    ctx.restore();
    ctx.strokeStyle = '#A9791F';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(logoCx, logoCy, logoRad, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// --- tiny IndexedDB helper so the file handle survives a page reload ---
// (Chrome/Edge can persist a FileSystemFileHandle this way, so the save
// picker only needs to be shown once, the first time this is used.)
function idbGet(key) {
  return new Promise((resolve) => {
    const req = indexedDB.open('donor-card-app', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('handles', 'readonly');
      const getReq = tx.objectStore('handles').get(key);
      getReq.onsuccess = () => resolve(getReq.result || null);
      getReq.onerror = () => resolve(null);
    };
    req.onerror = () => resolve(null);
  });
}
function idbSet(key, value) {
  return new Promise((resolve) => {
    const req = indexedDB.open('donor-card-app', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    };
    req.onerror = () => resolve(false);
  });
}

function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildCSV(list) {
  const header = ['Donor Name', 'Village', 'Amount (Rs)', 'Purpose', 'Date of Donation', 'Payment Method'];
  const rows = list.map(r => [r.name, r.village || '', r.amount || '', r.purpose || '', r.date, r.paymentMethod || '']);
  return [header, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
}

function parseCSVLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (lines.length < 2) return [];
  const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const column = (...names) => header.findIndex(h => names.includes(h));
  const nameIndex = column('donor name', 'name');
  const villageIndex = column('village');
  const amountIndex = column('amount (rs)', 'amount', 'donation amount');
  const paymentMethodIndex = column('payment method', 'payment mode', 'donation method');
  const purposeIndex = column('purpose', 'contribution towards');
  const dateIndex = column('date of donation', 'date');
  return lines.slice(1).map(line => {
    const cols = parseCSVLine(line);
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: cols[nameIndex === -1 ? 0 : nameIndex] || '',
      village: cols[villageIndex] || '',
      amount: cols[amountIndex] || '',
      paymentMethod: cols[paymentMethodIndex] || '',
      purpose: cols[purposeIndex] || '',
      date: cols[dateIndex] || '',
    };
  });
}

// Gets (and remembers) permission to write straight to donors.csv.
// The OS "choose a file" dialog only appears once — the very first time —
// after that the handle is reused silently, both within this tab and
// (via IndexedDB) across future visits, as long as permission still holds.
async function ensureFileHandle() {
    if (!window.showOpenFilePicker) {
        alert("Your browser does not support automatic CSV updating. Please use Google Chrome or Microsoft Edge.");
        return null;
    }

    if (csvFileHandle) return csvFileHandle;

    const savedHandle = await idbGet("donorsCsvHandle");

    if (savedHandle) {
        const permission = await savedHandle.requestPermission({
            mode: "readwrite"
        });

        if (permission === "granted") {
            csvFileHandle = savedHandle;
            return csvFileHandle;
        }
    }

    try {
        const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
                description: "CSV File",
                accept: {
                    "text/csv": [".csv"]
                }
            }]
        });

        await handle.requestPermission({
            mode: "readwrite"
        });

        csvFileHandle = handle;

        await idbSet("donorsCsvHandle", handle);

        return handle;

    } catch (e) {
        console.log(e);
        return null;
    }
}

async function logDonorEntry() {

    if (!state.paymentMethod) {
        document.getElementById('statusNote').textContent = 'Choose Cash or UPI before saving.';
        return;
    }

    const handle = await ensureFileHandle();

    if (!handle) return;

    // Read latest CSV every time
    let file = await handle.getFile();
    let text = await file.text();

    donorLog = parseCSV(text);

    donorLog.push({
        id: crypto.randomUUID(),
        name: state.name.trim(),
        village: state.village.trim(),
        amount: state.amount || "",
        paymentMethod: state.paymentMethod,
        purpose: state.purpose || "",
        date: formatDate(state.date, "en-IN", { day: "numeric", month: "short", year: "numeric" })
    });

    renderHistory();

    const csv = buildCSV(donorLog);

    const writable = await handle.createWritable();

    await writable.write(csv);

    await writable.close();

    document.getElementById("statusNote").textContent =
        "Donor added successfully.";
}

function renderHistory() {

    if (!donorLog.length) {
        historyGrid.innerHTML =
            '<div class="history-empty">No entries yet.</div>';
        return;
    }

    historyGrid.innerHTML = "";

    // Only latest 5 donors
    const recentDonors = donorLog.slice(-5).reverse();

    recentDonors.forEach((rec) => {

        const div = document.createElement("div");

        div.className = "history-card";

        div.innerHTML = `
            <div class="hname">${rec.name}</div>

            <div class="hmeta">
                ${rec.date}
                ${rec.village ? "<br>" + rec.village : ""}
                ${rec.amount ? "<br>₹ " + Number(rec.amount).toLocaleString("en-IN") : ""}
                ${rec.paymentMethod ? " · " + rec.paymentMethod : ""}
            </div>

            <button class="hdel">Delete</button>
        `;

        // Load donor back into the form
        div.addEventListener("click", (e) => {

            if (e.target.closest(".hdel")) return;

            state.nameRaw = rec.name;
            state.name = transliterateForLang(state.nameRaw, state.lang);
            state.village = rec.village || "";
            state.amount = rec.amount || "";
            state.paymentMethod = rec.paymentMethod || "";
            state.purpose = rec.purpose || "";
            state.date = dateToInputValue(rec.date) || localTodayISO();

            donorName.value = state.nameRaw;
            villageEl.value = state.village;
            donorAmount.value = state.amount;
            document.querySelectorAll('input[name="paymentMethod"]').forEach(input => {
                input.checked = input.value === state.paymentMethod;
            });
            purpose.value = state.purpose;
            donationDateEl.value = state.date;

            draw();
        });

        div.querySelector(".hdel").addEventListener("click", async (e) => {

            e.stopPropagation();

            donorLog = donorLog.filter(r => r.id !== rec.id);

            renderHistory();

            const csv = buildCSV(donorLog);

            const handle = await ensureFileHandle();

            if (handle) {
                const writable = await handle.createWritable();
                await writable.write(csv);
                await writable.close();
            }

        });

        historyGrid.appendChild(div);

    });

}

// A download requested from the donor register reuses the saved row and
// deliberately bypasses logDonorEntry(), so no duplicate CSV row is written.
function loadCardFromQuery() {
  const params = new URLSearchParams(window.location.search);
  if (!params.has('name')) return false;

  state.nameRaw = params.get('name') || '';
  state.name = transliterateForLang(state.nameRaw, state.lang);
  state.village = params.get('village') || '';
  state.amount = (params.get('amount') || '').replace(/[^0-9.]/g, '');
  state.paymentMethod = params.get('paymentMethod') || '';
  state.purpose = params.get('purpose') || COPY[state.lang].defaultPurpose;
  state.date = params.get('date') || localTodayISO();
  purposeEl.dataset.userEdited = '1';
  document.getElementById('donorName').value = state.nameRaw;
  document.getElementById('village').value = state.village;
  document.getElementById('donorAmount').value = state.amount;
  document.querySelectorAll('input[name="paymentMethod"]').forEach(input => {
    input.checked = input.value === state.paymentMethod;
  });
  donationDateEl.value = state.date;
  purposeEl.value = state.purpose;
  return params.get('download') === '1';
}
